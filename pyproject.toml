[project]
name = "myscraper"
version = "0.1.0"
description = "低并发、强合规的静态页面抓取与抽取工具（默认遵守 robots.txt）"
readme = "README.md"
authors = [
    { name = "fallcarrots", email = "33638838@qq.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["crawler","scraper","asyncio","httpx","robots-txt","compliance","beautifulsoup4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "soupsieve>=2.8",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "typer>=0.29.1",
    "rich>=15.0.0",
    "loguru>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/fallcarrots/myScraper"
Repository = "https://github.com/fallcarrots/myScraper"
Issues = "https://github.com/fallcarrots/myScraper/issues"

[project.scripts]
myscraper = "myscraper.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "twine>=7.0.0",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM","ASYNC","RUF","S","C4","PT"]
# 中文注释/文档中使用全角标点属预期，忽略易混淆字符规则
ignore = ["RUF001","RUF002","RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101","S105","S106"]
"src/myscraper/cli.py" = ["B008"]
# S506: 本文件显式传入了禁用隐式布尔的自定义 SafeLoader，非裸 yaml.load
"src/myscraper/config.py" = ["S506"]

[tool.ruff.lint.isort]
known-first-party = ["myscraper"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["myscraper"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]